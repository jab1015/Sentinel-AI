name: Sentinel Microsoft Store Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/microsoft-store-bundle.yml'
      - 'src/SentinelAI/Sentinel.App/**'
      - 'src/SentinelAI/Sentinel.PrivilegedBroker/**'
      - 'src/SentinelAI/Sentinel.ExplorerExtension/**'

permissions:
  contents: read

concurrency:
  group: sentinel-store-bundle-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-store-upload:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Locate MSBuild and MakeAppx
        id: tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found." }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) { throw "MSBuild.exe was not found." }
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" -File -ErrorAction Stop | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $makeappx) { throw "MakeAppx.exe was not found." }
          "msbuild=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "makeappx=$($makeappx.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify Store Release boundary
        shell: pwsh
        run: |
          $project = Get-Content 'src/SentinelAI/Sentinel.App/Sentinel.App/Sentinel.App.csproj' -Raw
          $manifest = Get-Content 'src/SentinelAI/Sentinel.App/Sentinel.App (Package)/Package.appxmanifest' -Raw
          if ($manifest -notmatch 'Name="ModernMethods\.SentinelAI"') { throw 'Unexpected Store package identity.' }
          if ($manifest -notmatch 'Version="1\.0\.29\.0"') { throw 'Expected Store version 1.0.29.0.' }
          if ($project -notmatch 'SENTINEL_LOCAL_DEV') { throw 'LocalDev boundary declaration was not found.' }
          Write-Host 'Store identity and Release/LocalDev boundary verified.'

      - name: Build Release x64 Microsoft Store upload bundle
        shell: pwsh
        run: |
          $project = 'src\SentinelAI\Sentinel.App\Sentinel.App (Package)\Sentinel.App (Package).wapproj'
          & '${{ steps.tools.outputs.msbuild }}' $project `
            /restore `
            /m `
            /nr:false `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=false `
            /fl `
            "/flp:logfile=msbuild-store-bundle.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate and validate Store artifacts
        shell: pwsh
        run: |
          $root = 'src\SentinelAI\Sentinel.App\Sentinel.App (Package)\AppPackages'
          if (-not (Test-Path $root)) { throw 'AppPackages output folder was not created.' }
          $uploads = @(Get-ChildItem $root -Recurse -File -Filter '*.msixupload' -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending)
          $bundles = @(Get-ChildItem $root -Recurse -File -Filter '*.msixbundle' -ErrorAction SilentlyContinue | Sort-Object LastWriteTimeUtc -Descending)
          if ($uploads.Count -eq 0 -and $bundles.Count -eq 0) {
            Get-ChildItem $root -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
            throw 'Neither a .msixupload nor .msixbundle Store artifact was generated.'
          }
          Write-Host "MSIXUPLOAD artifacts: $($uploads.Count)"
          $uploads | Select-Object FullName, Length, LastWriteTimeUtc | Format-Table -AutoSize
          Write-Host "MSIXBUNDLE artifacts: $($bundles.Count)"
          $bundles | Select-Object FullName, Length, LastWriteTimeUtc | Format-Table -AutoSize
          $bundle = $bundles | Select-Object -First 1
          if ($null -ne $bundle) {
            $unbundle = Join-Path $env:RUNNER_TEMP 'sentinel-store-unbundle'
            if (Test-Path $unbundle) { Remove-Item $unbundle -Recurse -Force }
            New-Item -ItemType Directory -Path $unbundle | Out-Null
            & '${{ steps.tools.outputs.makeappx }}' unbundle /p $bundle.FullName /d $unbundle /o
            if ($LASTEXITCODE -ne 0) { throw 'MakeAppx could not inspect the generated Store bundle.' }
            $inner = Get-ChildItem $unbundle -File -Filter '*_x64.msix' | Select-Object -First 1
            if ($null -eq $inner) { throw 'No x64 application MSIX was found inside the bundle.' }
            $unpack = Join-Path $env:RUNNER_TEMP 'sentinel-store-msix'
            if (Test-Path $unpack) { Remove-Item $unpack -Recurse -Force }
            New-Item -ItemType Directory -Path $unpack | Out-Null
            & '${{ steps.tools.outputs.makeappx }}' unpack /p $inner.FullName /d $unpack /o
            if ($LASTEXITCODE -ne 0) { throw 'MakeAppx could not inspect the application MSIX.' }
            [xml]$installedManifest = Get-Content (Join-Path $unpack 'AppxManifest.xml')
            $ns = New-Object System.Xml.XmlNamespaceManager($installedManifest.NameTable)
            $ns.AddNamespace('f', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
            $identity = $installedManifest.SelectSingleNode('/f:Package/f:Identity', $ns)
            if ($null -eq $identity) { throw 'Generated package manifest identity is missing.' }
            if ($identity.Name -ne 'ModernMethods.SentinelAI') { throw "Unexpected generated package name: $($identity.Name)" }
            if ($identity.Version -ne '1.0.29.0') { throw "Unexpected generated package version: $($identity.Version)" }
            $app = Get-ChildItem $unpack -Recurse -File -Filter 'Sentinel.App.exe' | Select-Object -First 1
            if ($null -eq $app) { throw 'Sentinel.App.exe is missing from the generated Store package.' }
            Write-Host 'Validated Store bundle identity ModernMethods.SentinelAI version 1.0.29.0.'
          }
          $inventory = Join-Path $env:GITHUB_WORKSPACE 'store-package-inventory.txt'
          @(
            'SOURCE_SHA=${{ github.sha }}',
            'VERSION=1.0.29.0',
            'CONFIGURATION=Release',
            'PLATFORM=x64'
          ) | Set-Content $inventory -Encoding utf8
          Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in '.msixupload','.msixbundle','.msix' } | ForEach-Object {
            "$($_.FullName) | $($_.Length) bytes | SHA256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          } | Add-Content $inventory
          Get-Content $inventory

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-MicrosoftStore-1.0.29.0
          path: |
            src/SentinelAI/Sentinel.App/Sentinel.App (Package)/AppPackages/**/*.msixupload
            src/SentinelAI/Sentinel.App/Sentinel.App (Package)/AppPackages/**/*.msixbundle
            store-package-inventory.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Store build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-MicrosoftStore-build-diagnostics
          path: msbuild-store-bundle.log
          if-no-files-found: ignore
          retention-days: 7
