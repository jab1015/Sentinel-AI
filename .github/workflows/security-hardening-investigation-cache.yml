name: Sentinel Investigation Cache Hardening

on:
  push:
    branches:
      - security/production-hardening-1218f5d
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  investigation-cache:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore investigation cache harness
        run: dotnet restore "tools/Sentinel.InvestigationCacheAcceptanceHarness/Sentinel.InvestigationCacheAcceptanceHarness.csproj"
      - name: Build investigation cache harness
        run: dotnet build "tools/Sentinel.InvestigationCacheAcceptanceHarness/Sentinel.InvestigationCacheAcceptanceHarness.csproj" -c Release --no-restore
      - name: Run investigation cache harness
        run: dotnet run --project "tools/Sentinel.InvestigationCacheAcceptanceHarness/Sentinel.InvestigationCacheAcceptanceHarness.csproj" -c Release --no-build
