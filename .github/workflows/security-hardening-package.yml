name: Sentinel Security Hardening Package

on:
  push:
    branches:
      - security/production-hardening-1218f5d
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found." }
          $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($path)) { throw "MSBuild.exe was not found." }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build unsigned x64 MSIX staging package
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' "src\SentinelAI\Sentinel.App\Sentinel.App (Package)\Sentinel.App (Package).wapproj" /restore /m /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false /fl "/flp:logfile=msbuild-package.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload package MSBuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-msbuild-diagnostics
          path: msbuild-package.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify privileged broker is packaged
        shell: pwsh
        run: |
          $packageRoot = "src\SentinelAI\Sentinel.App\Sentinel.App (Package)"
          $brokers = @(Get-ChildItem $packageRoot -Recurse -File -Filter "Sentinel.PrivilegedBroker.exe" -ErrorAction SilentlyContinue)
          if ($brokers.Count -eq 0) {
            throw "Sentinel.PrivilegedBroker.exe was not found in package build output. Privileged operations would be unavailable after installation."
          }
          $apps = @(Get-ChildItem $packageRoot -Recurse -File -Filter "Sentinel.App.exe" -ErrorAction SilentlyContinue)
          if ($apps.Count -eq 0) { throw "Sentinel.App.exe was not found in package build output." }
          Write-Host "Packaged Sentinel.App.exe count: $($apps.Count)"
          Write-Host "Packaged Sentinel.PrivilegedBroker.exe count: $($brokers.Count)"
          $brokers | ForEach-Object { Write-Host $_.FullName }

      - name: Record package inventory
        shell: pwsh
        run: |
          $packageRoot = "src\SentinelAI\Sentinel.App\Sentinel.App (Package)"
          Get-ChildItem $packageRoot -Recurse -File |
            Where-Object { $_.Name -match '^Sentinel\.(App|PrivilegedBroker)(\.exe|\.dll)$' -or $_.Extension -in '.msix','.appx' } |
            Select-Object FullName, Length, LastWriteTimeUtc |
            Format-Table -AutoSize
