name: Sentinel A14 Temporary Cleanup Hardening

on:
  push:
    branches:
      - security/production-hardening-1218f5d
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  temp-cleanup-hardening:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore A14 acceptance harness
        run: dotnet restore "tools/Sentinel.TempCleanupAcceptanceHarness/Sentinel.TempCleanupAcceptanceHarness.csproj"

      - name: Build A14 acceptance harness
        run: dotnet build "tools/Sentinel.TempCleanupAcceptanceHarness/Sentinel.TempCleanupAcceptanceHarness.csproj" -c Release --no-restore

      - name: Run A14 handle-based deletion acceptance
        run: dotnet run --project "tools/Sentinel.TempCleanupAcceptanceHarness/Sentinel.TempCleanupAcceptanceHarness.csproj" -c Release --no-build
