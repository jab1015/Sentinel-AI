name: Sentinel Windows VM Test Package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/premium-privacy-foundation
    paths:
      - '.github/workflows/windows-vm-test-package.yml'
      - 'tools/windows-vm/**'
      - 'src/SentinelAI/Sentinel.App/**'
      - 'src/SentinelAI/Sentinel.PrivilegedBroker/**'
      - 'src/SentinelAI/Sentinel.ExplorerExtension/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: windows-vm-test-package-v2-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-sign-validate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PACKAGE_NAME: SentinelAI-WindowsVM-x64.msix
      CERT_NAME: SentinelAI-TestSigning.cer
      OUTPUT_DIR: artifacts/windows-vm-test

    steps:
      - name: Checkout Premium Privacy source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Locate Windows build tools
        id: tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe was not found.' }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) { throw 'MSBuild.exe was not found.' }

          $sdkRoots = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory -ErrorAction Stop | Sort-Object Name -Descending
          $signtool = $null
          $makeappx = $null
          foreach ($root in $sdkRoots) {
            $candidateSign = Join-Path $root.FullName 'x64\signtool.exe'
            $candidateMake = Join-Path $root.FullName 'x64\makeappx.exe'
            if ((Test-Path $candidateSign) -and (Test-Path $candidateMake)) {
              $signtool = $candidateSign
              $makeappx = $candidateMake
              break
            }
          }
          if ($null -eq $signtool -or $null -eq $makeappx) { throw 'SignTool.exe/MakeAppx.exe were not found.' }
          "msbuild=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signtool=$signtool" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "makeappx=$makeappx" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify production package identity is unchanged
        shell: pwsh
        run: |
          $manifestPath = 'src\SentinelAI\Sentinel.App\Sentinel.App (Package)\Package.appxmanifest'
          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          $identity = $manifest.Package.Identity
          if ($identity.Name -ne 'ModernMethods.SentinelAI') { throw "Unexpected package name: $($identity.Name)" }
          if ($identity.Publisher -ne 'CN=EA91DFAA-447F-4250-AC3D-047D8D7F831A') { throw "Unexpected package publisher: $($identity.Publisher)" }
          Write-Host "Production package identity preserved: $($identity.Name), $($identity.Publisher), version $($identity.Version)."

      - name: Build unsigned Release x64 MSIX
        shell: pwsh
        run: |
          $packageProject = 'src\SentinelAI\Sentinel.App\Sentinel.App (Package)\Sentinel.App (Package).wapproj'
          $appPackages = 'src\SentinelAI\Sentinel.App\Sentinel.App (Package)\AppPackages'
          if (Test-Path $appPackages) { Remove-Item $appPackages -Recurse -Force }
          & '${{ steps.tools.outputs.msbuild }}' $packageProject /restore /m /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false /fl "/flp:logfile=windows-vm-test-package.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msixes = @(Get-ChildItem $appPackages -Recurse -File -Filter '*.msix' -ErrorAction Stop | Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' })
          if ($msixes.Count -ne 1) { throw "Expected exactly one generated MSIX, found $($msixes.Count)." }
          "UNSIGNED_MSIX=$($msixes[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create provider-independent ephemeral VM test certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:OUTPUT_DIR -Force | Out-Null
          [xml]$manifest = Get-Content -LiteralPath 'src\SentinelAI\Sentinel.App\Sentinel.App (Package)\Package.appxmanifest' -Raw
          $publisher = [string]$manifest.Package.Identity.Publisher
          $rsa = [Security.Cryptography.RSA]::Create(3072)
          $dn = [Security.Cryptography.X509Certificates.X500DistinguishedName]::new($publisher)
          $request = [Security.Cryptography.X509Certificates.CertificateRequest]::new($dn,$rsa,[Security.Cryptography.HashAlgorithmName]::SHA256,[Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $request.CertificateExtensions.Add([Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false,$false,0,$true))
          $request.CertificateExtensions.Add([Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new([Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,$true))
          $ekus = [Security.Cryptography.OidCollection]::new()
          [void]$ekus.Add([Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3','Code Signing'))
          $request.CertificateExtensions.Add([Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($ekus,$true))
          $cert = $request.CreateSelfSigned([DateTimeOffset]::UtcNow.AddMinutes(-5),[DateTimeOffset]::UtcNow.AddDays(30))
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'Failed to create in-memory test signing certificate with private key.' }
          if ($cert.Subject -ne $publisher) { throw "Certificate subject '$($cert.Subject)' does not match package Publisher '$publisher'." }
          $passwordPlain = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
          Write-Output "::add-mask::$passwordPlain"
          $pfxPath = Join-Path $env:RUNNER_TEMP 'SentinelAI-Ephemeral-TestSigning.pfx'
          [IO.File]::WriteAllBytes($pfxPath,$cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Pfx,$passwordPlain))
          $publicCert = Join-Path $env:OUTPUT_DIR $env:CERT_NAME
          [IO.File]::WriteAllBytes($publicCert,$cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $exported = [Security.Cryptography.X509Certificates.X509Certificate2]::new($publicCert)
          if ($exported.HasPrivateKey) { throw 'Exported VM certificate unexpectedly contains a private key.' }
          $hasCodeSigningEku = $false
          foreach ($extension in $exported.Extensions) {
            if ($extension -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
              foreach ($oid in $extension.EnhancedKeyUsages) { if ($oid.Value -eq '1.3.6.1.5.5.7.3.3') { $hasCodeSigningEku = $true } }
            }
          }
          if (-not $hasCodeSigningEku) { throw 'Generated certificate is missing the Code Signing EKU.' }
          "TEST_CERT_THUMBPRINT=$($exported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_CERT_SUBJECT=$publisher" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_SIGNING_PFX=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_SIGNING_PASSWORD=$passwordPlain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $cert.Dispose(); $rsa.Dispose()

      - name: Sign VM test MSIX
        shell: pwsh
        run: |
          $signedPackage = Join-Path $env:OUTPUT_DIR $env:PACKAGE_NAME
          Copy-Item -LiteralPath $env:UNSIGNED_MSIX -Destination $signedPackage -Force
          & '${{ steps.tools.outputs.signtool }}' sign /f $env:TEST_SIGNING_PFX /p $env:TEST_SIGNING_PASSWORD /fd SHA256 /v $signedPackage 2>&1 | Tee-Object -FilePath 'windows-vm-test-signing.log'
          if ($LASTEXITCODE -ne 0) { throw "SignTool sign failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path -LiteralPath $signedPackage -PathType Leaf)) { throw 'Signed package was not produced.' }
          Remove-Item -LiteralPath $env:TEST_SIGNING_PFX -Force -ErrorAction Stop
          Write-Host 'MSIX signing completed and runner-temp private PFX was deleted.'

      - name: Verify signed VM test MSIX
        shell: pwsh
        run: |
          $signedPackage = Join-Path $env:OUTPUT_DIR $env:PACKAGE_NAME
          $publicCert = Join-Path $env:OUTPUT_DIR $env:CERT_NAME
          Import-Certificate -FilePath $publicCert -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null
          Import-Certificate -FilePath $publicCert -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null

          $psi = [Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = '${{ steps.tools.outputs.signtool }}'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          foreach ($arg in @('verify','/pa','/v',$signedPackage)) { [void]$psi.ArgumentList.Add($arg) }
          $process = [Diagnostics.Process]::new()
          $process.StartInfo = $psi
          if (-not $process.Start()) { throw 'Failed to start SignTool verification process.' }
          $stdoutTask = $process.StandardOutput.ReadToEndAsync()
          $stderrTask = $process.StandardError.ReadToEndAsync()
          if (-not $process.WaitForExit(120000)) {
            try { $process.Kill($true) } catch {}
            $process.WaitForExit()
            $stdoutText = $stdoutTask.GetAwaiter().GetResult()
            $stderrText = $stderrTask.GetAwaiter().GetResult()
            if ($stdoutText) { $stdoutText | Tee-Object -FilePath 'windows-vm-test-signing.log' -Append }
            if ($stderrText) { $stderrText | Tee-Object -FilePath 'windows-vm-test-signing.log' -Append }
            throw 'SignTool verify exceeded the 120-second safety bound.'
          }
          $stdoutText = $stdoutTask.GetAwaiter().GetResult()
          $stderrText = $stderrTask.GetAwaiter().GetResult()
          if ($stdoutText) { $stdoutText | Tee-Object -FilePath 'windows-vm-test-signing.log' -Append }
          if ($stderrText) { $stderrText | Tee-Object -FilePath 'windows-vm-test-signing.log' -Append }
          if ($process.ExitCode -ne 0) { throw "SignTool verify failed with exit code $($process.ExitCode)." }

          $signature = Get-AuthenticodeSignature -LiteralPath $signedPackage
          if ($signature.Status -ne 'Valid') { throw "Authenticode validation failed: $($signature.Status) - $($signature.StatusMessage)" }
          if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $env:TEST_CERT_THUMBPRINT) { throw 'Signed package signer does not match the generated VM test certificate.' }
          if ($signature.SignerCertificate.Subject -ne $env:TEST_CERT_SUBJECT) { throw "Signed package subject '$($signature.SignerCertificate.Subject)' does not match Publisher '$env:TEST_CERT_SUBJECT'." }
          Write-Host "Package signature is valid and bound to $($signature.SignerCertificate.Subject)."

      - name: Inspect signed package contents and manifest
        shell: pwsh
        run: |
          $signedPackage = Join-Path $env:OUTPUT_DIR $env:PACKAGE_NAME
          $unpackRoot = Join-Path $env:RUNNER_TEMP 'sentinel-windows-vm-test-unpacked'
          if (Test-Path $unpackRoot) { Remove-Item $unpackRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $unpackRoot | Out-Null
          & '${{ steps.tools.outputs.makeappx }}' unpack /p $signedPackage /d $unpackRoot /o
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx failed to unpack the signed VM test package.' }

          $required = @('Sentinel.App.exe','Sentinel.PrivilegedBroker.exe','Sentinel.ExplorerExtension.dll')
          foreach ($name in $required) {
            $matches = @(Get-ChildItem $unpackRoot -Recurse -File -Filter $name)
            if ($matches.Count -ne 1) { throw "Expected exactly one $name in the package, found $($matches.Count)." }
            Write-Host "Found $name at $($matches[0].FullName.Substring($unpackRoot.Length + 1))."
          }

          [xml]$appxManifest = Get-Content -LiteralPath (Join-Path $unpackRoot 'AppxManifest.xml') -Raw
          $identity = $appxManifest.Package.Identity
          if ($identity.Name -ne 'ModernMethods.SentinelAI') { throw "Packaged identity name mismatch: $($identity.Name)" }
          if ($identity.Publisher -ne $env:TEST_CERT_SUBJECT) { throw "Packaged Publisher '$($identity.Publisher)' does not match signing subject '$env:TEST_CERT_SUBJECT'." }
          if ($identity.ProcessorArchitecture -ne 'x64') { throw "Expected x64 package architecture, found '$($identity.ProcessorArchitecture)'." }
          $manifestText = Get-Content -LiteralPath (Join-Path $unpackRoot 'AppxManifest.xml') -Raw
          foreach ($fragment in @('Category="windows.comServer"','Category="windows.fileExplorerContextMenus"','Sentinel.ExplorerExtension.dll','6C5E88B7-2A44-4B6D-9A6C-4F1A5C9F6E21','Type="*"','Type="Directory"')) {
            if ($manifestText -notlike "*$fragment*") { throw "Packaged manifest is missing expected Explorer registration fragment: $fragment" }
          }

          function Get-PeMachine([string]$Path) {
            $bytes = [IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Invalid PE file: $Path" }
            $peOffset = [BitConverter]::ToInt32($bytes,0x3c)
            if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) { throw "Invalid PE header offset: $Path" }
            return [BitConverter]::ToUInt16($bytes,$peOffset + 4)
          }
          foreach ($name in $required) {
            $file = Get-ChildItem $unpackRoot -Recurse -File -Filter $name | Select-Object -First 1
            $machine = Get-PeMachine $file.FullName
            if ($machine -ne 0x8664) { throw "$name is not x64 PE (machine=0x$('{0:X4}' -f $machine))." }
          }
          Write-Host 'Package contents, manifest registrations, and x64 PE architecture validated.'

      - name: Stage install helpers and package metadata
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'tools\windows-vm\Install-SentinelAI-Test.ps1' -Destination $env:OUTPUT_DIR -Force
          Copy-Item -LiteralPath 'tools\windows-vm\Uninstall-SentinelAI-Test.ps1' -Destination $env:OUTPUT_DIR -Force
          $signedPackage = Join-Path $env:OUTPUT_DIR $env:PACKAGE_NAME
          $hash = (Get-FileHash -LiteralPath $signedPackage -Algorithm SHA256).Hash
          "$hash  $env:PACKAGE_NAME" | Set-Content -LiteralPath (Join-Path $env:OUTPUT_DIR 'SHA256SUMS.txt') -Encoding ascii
          @(
            "Branch=feature/premium-privacy-foundation",
            "SourceSHA=${{ github.sha }}",
            'Architecture=x64',
            'Configuration=Release',
            'Format=MSIX',
            "Package=$env:PACKAGE_NAME",
            "Certificate=$env:CERT_NAME",
            "SHA256=$hash",
            'Signing=Ephemeral runner-only test PFX; public CER only retained',
            'ProductionStoreReady=NO',
            'MergeToMain=NO'
          ) | Set-Content -LiteralPath (Join-Path $env:OUTPUT_DIR 'PACKAGE-METADATA.txt') -Encoding utf8
          $privateMaterial = @(Get-ChildItem $env:OUTPUT_DIR -Recurse -File | Where-Object { $_.Extension -in @('.pfx','.p12','.key','.pem') })
          if ($privateMaterial.Count -ne 0) { throw 'Private signing material was found in the artifact staging directory.' }
          Write-Host "Package SHA-256: $hash"

      - name: Upload signed Windows VM test package
        uses: actions/upload-artifact@v4
        with:
          name: windows-vm-test-package
          path: artifacts/windows-vm-test/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish package verification status
        if: success()
        shell: pwsh
        run: |
          Write-Host 'WINDOWS VM TEST PACKAGE: PASS'
          Write-Host "Source SHA: ${{ github.sha }}"
          Write-Host 'Release x64 build, test signature, package contents, manifest registration, PE architecture, helpers, and public certificate validated.'

      - name: Remove ephemeral test certificate private key
        if: always()
        shell: pwsh
        run: |
          if ($env:TEST_SIGNING_PFX -and (Test-Path -LiteralPath $env:TEST_SIGNING_PFX)) { Remove-Item -LiteralPath $env:TEST_SIGNING_PFX -Force -ErrorAction SilentlyContinue }
          Get-ChildItem Cert:\CurrentUser\TrustedPeople -ErrorAction SilentlyContinue | Where-Object { $_.Thumbprint -eq $env:TEST_CERT_THUMBPRINT } | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\CurrentUser\Root -ErrorAction SilentlyContinue | Where-Object { $_.Thumbprint -eq $env:TEST_CERT_THUMBPRINT } | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Upload package build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-vm-test-package-diagnostics
          path: |
            windows-vm-test-package.log
            windows-vm-test-signing.log
          if-no-files-found: ignore
          retention-days: 7
